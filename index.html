<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Busca GitHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

</head>

<body>

    <div class="container text-center">

        <main>

            <!-- Busca Usuário -->
            <section>
                <!-- Title -->
                <div class="display-6 mt-3">Busca Usuário GitHub</div>

                <form onsubmit="search(); return false;">
                    <div class="row justify-content-center mt-3 mb-5">
                        <div class="col-lg-6">
                            <input type="text" class="form-control" id="inputUser"
                                placeholder="Digite um usuário do GitHub">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Pesquisar</button>
                </form>
            </section>

            <section>
                <div class="display-6 mt-3">Dados do Usuário:</div>

                <div class="row mt-3 justify-content-center">
                    <div class="col-lg-6" id="userData"></div>
                </div>
            </section>


            <section class="mt-5 mb-5">
                <div class="display-6 mt-3">Pesquisados:</div>
                <div class="row mt-3">
                    <div class="col">
                        <img class="rounded shadow mt-2" width="100" height="110"
                            src="https://avatars.githubusercontent.com/u/179748282?v=4" id="avatar_url">
                    </div>
                    <div class="col">
                        <img class="rounded shadow mt-2" width="110" height="110"
                            src="https://avatars.githubusercontent.com/u/179748282?v=4" id="avatar_url">
                    </div>
                    <div class="col">
                        <img class="rounded shadow mt-2" width="110" height="110"
                            src="https://avatars.githubusercontent.com/u/179748282?v=4" id="avatar_url">
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- BootStrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <!-- JQuery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
